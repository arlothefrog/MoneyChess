  const isFree = !!state.freeCast || state.freeSpellId === id;
  // A spell cast for free (via Freecast, or the extra granted by an RND/double
  // modifier) resolves as a plain spell — the rolled special modifier never
  // applies, so a free pickup can't chain into another "2x"/"RND" offer.
  const mod = isFree ? "normal" : (state.spellMods[slotIndex] || "normal");
  const effCost = spellEffCost(id, mod);
  // Precast: the next spell is free. Using the Precast itself is not free.
  if (!isFree && state.money[state.turn] < effCost) return;

  state.history.push(cloneStateForHistory(state));
  if (!isFree) state.money[state.turn] -= effCost;
  // Free cast consumed; the target/spell that uses it finished the precast chain.
  state.freeCast = false;
  if (state.freeSpellId === id) state.freeSpellId = null;
  // Casting a spell resets the spell refresh timer (piece shop unaffected).
  state.spellTurns = 0;
  // The "double" modifier normally recasts the spell free; "random" grants a
  // random extra spell. A double Echo doubles its own effect (2 extra turns)
  // instead of generating a follow-up card.
  const inlineDouble = mod === "double" && id === "echo";
  if (inlineDouble) state.followUpSpell = null;
  else if (mod === "double") state.followUpSpell = { kind: "double", id };
  else if (mod === "random") state.followUpSpell = { kind: "random" };

  switch (id) {
    case "moneySkip":
      if (state.followUpSpell) {
        // Tax Gain 2x: bank the first +$3 but hang on to your turn.
        // You must now either play the second Tax (free) or hit "Skip Turn":
        // while the offer is pending you're locked out of moving pieces and
        // casting everything except the free Tax.
        state.money[state.turn] += 3;
        applySpellFollowUp();
        state.taxSkipPending = true;
      } else {
        state.taxSkipPending = false;
        spellEndTurnSkip();
      }
      break;
    case "killRandom":
      spellKillRandom();
      break;
    case "killPawn":
      state.targetMode = { kind: "enemyPawn", spellId: id };
      break;
    case "block":
      state.targetMode = { kind: "anyEmpty", spellId: id };
      break;
    case "sleep":
      state.targetMode = { kind: "enemyPiece", spellId: id };
      break;
    case "bounty":
      spellBounty();
      break;
    case "dispel":
      state.targetMode = { kind: "dispelable", spellId: id };
      break;
    case "echo":
      spellEcho(mod);
      break;
    case "push":
      state.targetMode = { kind: "pushable", spellId: id };
      break;
    case "precast":
      spellPrecast();
      break;
    case "confuse":
      state.targetMode = { kind: "confuse", spellId: id };
      break;
    case "piratify":
      state.targetMode = { kind: "piratify", spellId: id };
      break;
    case "summon":
      // Summon: place a random piece on your side; ends your turn.
      state.placementMode = true;
      state.placementPiece = SUMMON_POOL[Math.floor(Math.random() * SUMMON_POOL.length)];
      state.placementMod = null;
      state.placementSpellId = "summon";
      break;
  }
  state.selected = null;
  state.legalForSelected = [];
  render();
}

function finishSpell(logTxt) {
  state.spellUsedThisTurn = true;
  state.targetMode = null;
  refillSpells();
  pushSpellLog(logTxt);
  endTurnChecks();
  applySpellFollowUp();
  render();
}

// Grant the follow-up spell of a double/random modifier. Only that single
// spell is revealed as the free option (locked until cast).
function applySpellFollowUp() {
  const fu = state.followUpSpell;
  state.followUpSpell = null;
  if (!fu || state.gameOver) return;
  let id;
  if (fu.kind === "double") id = fu.id;
  else id = randomSpell();
  const prevSpells = state.spells;
  const prevMods = state.spellMods;
  state.spells = [id, null, null];
  state.spellMods = ["normal", null, null];
  state.stashSpells = prevSpells;
  state.stashSpellMods = prevMods;
  state.freeSpellId = id;
  state.followUpOwner = state.turn;
  renderSpells();
  STATUS_EL.textContent = (state.turn === "w" ? "White" : "Black") + " — " + SPELLS[id].name + " is free (modifier)";
}

// A double/random spell left a free follow-up on the table (after the caster
// already used the first activation). "Skip Spell" declines that second offer
// so the turn continues normally; the free bar returns to the pre-offer spells.
function skipFollowUpSpell() {
  if (!state.freeSpellId || state.followUpOwner !== state.turn) return;
  state.followUpSpell = null;
  state.freeSpellId = null;
  state.followUpOwner = null;
  if (state.stashSpells) {
    state.spells = state.stashSpells;
    state.spellMods = state.stashSpellMods;
  } else {
    refillSpells();
  }
  state.stashSpells = null;
  state.stashSpellMods = null;
  render();
}

// A turn-ending spell (Tax Gain / Summon) that carries a double/random follow-up
// moves that offer to the caster's NEXT turn so they still get their free extra.
function queueFollowUpForNextTurn() {
  const fu = state.followUpSpell;
  state.followUpSpell = null;
  state.freeSpellId = null;
  state.followUpOwner = null;
  if (!fu) return;
  state.nextFollowUp = { player: state.turn, kind: fu.kind, id: fu.id };
}

function spellEndTurnSkip(grantMoney = true) {
  // Grants +$3 and ends the turn (skips move), when grantMoney=true. The false
  // form is used by the "Skip Turn" button on a Tax Gain 2x offer, which just
  // passes the turn without taking the second +$3.
  expireEffectsAtTurnEnd();
  // A double/random modifier earned by this turn-ending spell is handed to the
  // caster's next turn (the spell itself switches the turn below).
  queueFollowUpForNextTurn();
  if (state.extraTurns[state.turn] > 0) {
    // spending a skip on the extra turn just passes that extra; also clears no-capture
    state.extraTurns[state.turn] -= 1;
    state.noCapture[state.turn] = Math.max(0, state.noCapture[state.turn] - 1);
  }
  if (grantMoney) state.money[state.turn] += 3;
  if (state.turn === "b") state.fullmove++;
  state.moveLog.push(grantMoney ? "(skip +$3)" : "(skip)");
  state.noCapture[state.turn] = Math.max(0, state.noCapture[state.turn] - 1);
  // A skipped turn still passes a turn: advance both refresh timers by 1.
  state.shopTurns += 1;
  state.spellTurns += 1;
  state.turn = opp(state.turn);
  state.lastMove = null;
  state.spellUsedThisTurn = false;
  state.taxSkipPending = false;
  state.summonSkipPending = false;
  state.targetMode = null;
  refillSpells();
  onTurnStart(state.turn);
  rebuildHistorySel();
  endTurnChecks();
  render();
}

function strikeLightning(r, c) {
  if (state.lightningStrike) clearTimeout(state.lightningStrikeTimer);
  state.lightningStrike = { r, c };
  state.lightningStrikeTimer = setTimeout(() => {
    state.lightningStrike = null;
    render();
  }, 2200);
  render();
}

// Remove square-tracking effects (piratify/confused/sleep markers) when a
// piece is removed by a non-piece effect (lightning, snipe), so they don't
// linger on an empty square for a later piece to "pick up".
function clearPieceEffects(r, c) {
  state.piratify = state.piratify.filter(x => !(x.r===r && x.c===c));
  state.confused = state.confused.filter(x => !(x.r===r && x.c===c));
  // A removed piece can no longer be sleeping either.
  const si = state.sleeping.findIndex(s => s.r===r && s.c===c);
  if (si >= 0) state.sleeping.splice(si, 1);
}

function spellKillRandom() {
  const mine = [], foes = [];
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
    const p = state.board[r][c];
    if (p && p.type !== "K") (p.color === state.turn ? mine : foes).push({r,c});
  }
  if (!mine.length && !foes.length) { refundSpellNoEffect("killRandom"); return; }
  const pool = (Math.random() < 0.75 ? foes : mine);
  if (!pool.length) { refundSpellNoEffect("killRandom"); return; }
  const t = pool[Math.floor(Math.random()*pool.length)];
  const victim = state.board[t.r][t.c];
  applyBountyIfAny(victim);
  state.board[t.r][t.c] = null;
  clearPieceEffects(t.r, t.c);
  const label = `${state.turn==="w"?"W":"B"}:Lightning@${sqName(t.r,t.c)}`;
  finishSpell(label);
  strikeLightning(t.r, t.c);
}

function spellBounty() {
  const myCands = [], foeCands = [];
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
    const p = state.board[r][c];
    if (p && p.type !== "K") {
      if (p.color === state.turn) myCands.push({r,c});
      else foeCands.push({r,c});
    }
  }
  // Bounty a single caster piece, but TWO enemy pieces.
  if (!myCands.length || foeCands.length < 2) { refundSpellNoEffect("bounty"); return; }
  const mine = myCands[Math.floor(Math.random()*myCands.length)];
  const f1 = foeCands.splice(Math.floor(Math.random()*foeCands.length), 1)[0];
  const f2 = foeCands.splice(Math.floor(Math.random()*foeCands.length), 1)[0];
  state.board[mine.r][mine.c] = { ...state.board[mine.r][mine.c], bounty: state.turn };
  state.board[f1.r][f1.c] = { ...state.board[f1.r][f1.c], bounty: state.turn };
  state.board[f2.r][f2.c] = { ...state.board[f2.r][f2.c], bounty: state.turn };
  finishSpell(`${state.turn==="w"?"W":"B"}:Bounty@${sqName(mine.r,mine.c)}+${sqName(f1.r,f1.c)},${sqName(f2.r,f2.c)}`);
}

function spellEcho(mod) {
  // Echo (1x): no captures during this and one extra turn.
  // Echo (2x): no captures during this + TWO extra turns.
  const doubles = mod === "double";
  state.noCapture[state.turn] = doubles ? 3 : 2;  // current move + N extra moves
  state.extraTurns[state.turn] = doubles ? 2 : 1;
  finishSpell(`${state.turn==="w"?"W":"B"}:Echo${doubles?" x2":""}`);
}

function spellPrecast() {
  // Lets you cast another spell this turn, and that next spell is free.
  state.freeCast = true;
  state.spellUsedThisTurn = false;
  refillSpells();
  pushSpellLog(`${state.turn==="w"?"W":"B"}:Precast`);
  // If this Freecast had a 2x/random modifier, the follow-up is NOT revealed yet:
  // first the refreshed store stays available so the free spell can be cast, and
  // the second copy is handed out once that free spell resolves (finishSpell),
  // matching "first freecast refreshes the store, then you cast the second."
  endTurnChecks();
  render();
}

function refundSpellNoEffect(id) {
  // spell had no valid target — refund cost, do not consume the one-spell-per-turn
  state.money[state.turn] += SPELLS[id].cost;
  // a cast that fizzled shouldn't keep its double/random follow-up waiting
  state.followUpSpell = null;
  // pop the history snapshot we pushed
  state.history.pop();
  state.targetMode = null;
  render();
}

function handleTargetClick(r, c) {
  const tm = state.targetMode;
  if (!tm) return;
  if (tm.kind === "enemyPawn") {
    const p = state.board[r][c];
    if (!p || p.type !== "P" || p.color === state.turn) { render(); return; }
    applyBountyIfAny(p);
    state.board[r][c] = null;
    clearPieceEffects(r, c);
    finishSpell(`${state.turn==="w"?"W":"B"}:Snipe@${sqName(r,c)}`);
  } else if (tm.kind === "anyEmpty") {
    if (state.board[r][c]) { render(); return; }
    state.blocked.push({ r, c, owner: state.turn, rem: 2 });
    finishSpell(`${state.turn==="w"?"W":"B"}:Wall@${sqName(r,c)}`);
  } else if (tm.kind === "enemyPiece") {
    const p = state.board[r][c];
    if (!p || p.color === state.turn) { render(); return; }
    state.sleeping.push({ r, c, owner: state.turn, rem: 2 });
    finishSpell(`${state.turn==="w"?"W":"B"}:Sleep@${sqName(r,c)}`);
  } else if (tm.kind === "confuse") {
    const p = state.board[r][c];
    if (!p || p.color === state.turn) { render(); return; }
    if (state.confused.some(x => x.r===r && x.c===c)) { render(); return; }
    state.confused.push({ r, c });
    finishSpell(`${state.turn==="w"?"W":"B"}:Confusion@${sqName(r,c)}`);
  } else if (tm.kind === "ownPiece") {
    const p = state.board[r][c];
    if (!p || p.color !== state.turn) { render(); return; }
    state.piratify.push({ r, c });
    finishSpell(`${state.turn==="w"?"W":"B"}:Piratify@${sqName(r,c)}`);
  } else if (tm.kind === "piratify") {
    const p = state.board[r][c];
    if (!p || p.color !== state.turn) { render(); return; }
    if (state.piratify.some(x => x.r===r && x.c===c)) { render(); return; }
    state.piratify.push({ r, c });
    finishSpell(`${state.turn==="w"?"W":"B"}:Piratify@${sqName(r,c)}`);
  } else if (tm.kind === "dispelable") {
    const blockedIdx = state.blocked.findIndex(b => b.r===r && b.c===c);
    const sleepIdx = state.sleeping.findIndex(s => s.r===r && s.c===c);
    const confIdx = state.confused.findIndex(x => x.r===r && x.c===c);
    const pirIdx = state.piratify.findIndex(x => x.r===r && x.c===c);
    const p = state.board[r][c];
    if (blockedIdx < 0 && sleepIdx < 0 && confIdx < 0 && pirIdx < 0 && !(p && p.bounty)) { render(); return; }
    let what = "";
    if (blockedIdx >= 0) { state.blocked.splice(blockedIdx,1); what = "wall"; }
    if (sleepIdx >= 0) { state.sleeping.splice(sleepIdx,1); what = what ? what+"/sleep" : "sleep"; }
    if (confIdx >= 0) { state.confused.splice(confIdx,1); what = what ? what+"/confusion" : "confusion"; }
    if (pirIdx >= 0) { state.piratify.splice(pirIdx,1); what = what ? what+"/piratify" : "piratify"; }
    if (p && p.bounty) { p.bounty = null; what = what ? what+"/bounty" : "bounty"; }
    finishSpell(`${state.turn==="w"?"W":"B"}:Dispel@${sqName(r,c)}(${what})`);
  } else if (tm.kind === "pushable") {
    const p = state.board[r][c];
    if (!p) { render(); return; }
    const dir = p.color === "w" ? 1 : -1;
    let tr = r, moved = 0;
    while (moved < 3) {
      const nr = tr + dir;
      if (!inBounds(nr, c) || state.blocked.some(b=>b.r===nr && b.c===c) || state.board[nr][c]) break;
      tr = nr; moved++;
    }
    if (moved === 0) { render(); return; }
    // Move a sleeping marker along with the piece
    const si = state.sleeping.findIndex(s => s.r===r && s.c===c);
    if (si >= 0) state.sleeping[si].r = tr;
    state.board[tr][c] = p;
    state.board[r][c] = null;
    finishSpell(`${state.turn==="w"?"W":"B"}:Push@${sqName(r,c)}?${sqName(tr,c)}`);
  }
}

function sqName(r, c) { return "abcdefgh"[c] + (8 - r); }

const TIP_EL = document.getElementById("pieceTip");
let TIP_TIMER = null;
function showPieceTip(r, c, sq) {
  clearTimeout(TIP_TIMER);
  TIP_TIMER = setTimeout(() => { renderTip(r, c, sq); }, 1500);
}
function renderTip(r, c, sq) {
  const p = state.board[r][c];
  if (!p) return;
  const name = (PIECE_NAME[p.type] || p.type) + " (" + (p.color === "w" ? "White" : "Black") + ")";
  const statuses = [];
  if (isSleeping(state, r, c)) statuses.push("sleeping (can't move this turn)");
  if (p.bounty) statuses.push("bountied (worth +$1 when captured)");
  if (p.golden) statuses.push("golden (+$1 per capture)");
  if (p.platinum) statuses.push("platinum (+$3 per capture)");
  if (state.piratify.some(x => x.r===r && x.c===c)) statuses.push("piratified (+$2 per capture)");
  if (state.confused.some(x => x.r===r && x.c===c)) statuses.push("confused (moves randomly)");
  if (state.blocked.some(b => b.r===r && b.c===c)) statuses.push("blocked");
  let html = `<span class="tip-name">${name}</span>`;
  if (statuses.length) html += `<div class="tip-status">Status: ${statuses.join(", ")}</div>`;
  html += `<div class="tip-moves">Moves: ${PIECE_MOVES[p.type] || "—"}</div>`;
  showTip(html, sq);
}
function showShopTip(e, card) {
  clearTimeout(TIP_TIMER);
  TIP_TIMER = setTimeout(() => {
    const name = PIECE_NAME[e.p] || e.p;
    const mod = e.mod === "golden" ? " (golden, +$1 per capture)"
      : e.mod === "platinum" ? " (platinum, +$3 per capture)"
      : e.mod === "free" ? " (free)" : e.mod === "pricier" ? " (+$1)" : e.mod === "discount" ? " (-$1)" : "";
    const html = `<span class="tip-name">${name}</span><div class="tip-status">Shop: $${shopPrice(e)}${mod}</div><div class="tip-moves">Moves: ${PIECE_MOVES[e.p] || "—"}</div>`;
    showTip(html, card);
  }, 1500);
}
function showTip(html, sq) {
  TIP_EL.innerHTML = html;
  TIP_EL.style.display = "block";
  const rect = sq.getBoundingClientRect();
  let x = rect.left;
  let y = rect.top - TIP_EL.offsetHeight - 8;
  if (y < 8) y = rect.bottom + 8;
  if (x + TIP_EL.offsetWidth > window.innerWidth - 8) x = window.innerWidth - TIP_EL.offsetWidth - 8;
  if (x < 8) x = 8;
  TIP_EL.style.left = x + "px";
  TIP_EL.style.top = y + "px";
}
function hidePieceTip() {
  clearTimeout(TIP_TIMER);
  TIP_TIMER = null;
  TIP_EL.style.display = "none";
}

function cancelPlacement() {
  if (state.targetMode) {
    // Cancel a targeting spell: refund the cost and restore the exact pre-cast
    // state (freeCast flag, spell shop, etc.) from the snapshot castSpell pushed.
    const prev = state.history.pop();
    if (prev) {
      state.board = prev.board;
      state.turn = prev.turn;
      state.castling = prev.castling;
      state.epTarget = prev.epTarget;
      state.halfmove = prev.halfmove;
      state.fullmove = prev.fullmove;
      state.lastMove = prev.lastMove;
      state.moveLog = prev.moveLog;
      state.gameOver = prev.gameOver;
      state.money = prev.money;
      state.shop = prev.shop;
      state.shopTurns = prev.shopTurns;
      state.spellTurns = prev.spellTurns;
      state.placementMode = prev.placementMode;
      state.placementPiece = prev.placementPiece;
      state.placementMod = prev.placementMod;
      state.placementIsSpell = prev.placementIsSpell;
      state.placementSpellId = prev.placementSpellId;
      state.pendingRefillShopSlot = prev.pendingRefillShopSlot;
      state.spells = prev.spells;
      state.spellMods = [...prev.spellMods];
      state.followUpSpell = prev.followUpSpell ? {...prev.followUpSpell} : null;
      state.freeSpellId = prev.freeSpellId || null;
      state.nextFollowUp = prev.nextFollowUp ? {...prev.nextFollowUp} : null;
      state.followUpOwner = prev.followUpOwner || null;
      state.spellUsedThisTurn = prev.spellUsedThisTurn;
      state.freeCast = !!prev.freeCast;
      state.taxSkipPending = !!prev.taxSkipPending;
      state.summonSkipPending = !!prev.summonSkipPending;
      state.blocked = prev.blocked.map(b=>({...b}));
      state.sleeping = prev.sleeping.map(b=>({...b}));
state.confused = prev.confused.map(b=>({...b}));
      state.piratify = prev.piratify.map(b=>({...b}));
      state.targetMode = prev.targetMode ? {...prev.targetMode} : null;
      state.noCapture = { w: prev.noCapture.w, b: prev.noCapture.b };
      state.extraTurns = { w: prev.extraTurns.w, b: prev.extraTurns.b };
      state.selected = null;
      state.legalForSelected = [];
    } else {
      state.targetMode = null;
    }
    render();
    return;
  }
  if (!state.placementMode) return;
  const prev = state.history.pop();
  state.board = prev.board;
  state.turn = prev.turn;
  state.castling = prev.castling;
  state.epTarget = prev.epTarget;
  state.halfmove = prev.halfmove;
  state.fullmove = prev.fullmove;
  state.lastMove = prev.lastMove;
  state.moveLog = prev.moveLog;
  state.gameOver = prev.gameOver;
  state.money = prev.money;
  state.shop = prev.shop;
  state.shopTurns = prev.shopTurns;
  state.spellTurns = prev.spellTurns;
  state.placementMode = false;
  state.placementPiece = null;
  state.placementMod = null;
  state.placementIsSpell = false;
  state.placementSpellId = null;
  state.selected = null;
  state.legalForSelected = [];
  rebuildHistorySel();
  render();
}

function rebuildHistorySel() {
  HISTORY_SEL.innerHTML = "";
  for (let i=0;i<state.moveLog.length;i+=2) {
    const opt = document.createElement("option");
    const num = (i/2)+1;
    const w = state.moveLog[i] || "";
    const b = state.moveLog[i+1] || "";
    opt.text = num + ". " + w + (b ? " " + b : "");
    HISTORY_SEL.appendChild(opt);
  }
  if (state.moveLog.length) HISTORY_SEL.selectedIndex = HISTORY_SEL.options.length-1;
}

function showPromotion() {
  PROMO_CHOICES.innerHTML = "";
  const color = state.turn;
  for (const t of ["Q","R","B","N"]) {
    const d = document.createElement("div");
    d.textContent = GLYPH[t];
    d.style.color = color === "w" ? "#ffffff" : "#1a1a1a";
    d.style.background = color === "w" ? "#6b7b8f" : "#f0d9b5";
    d.addEventListener("click", () => {
      const pp = pendingPromotion;
      pendingPromotion = null;
      PROMO_EL.style.display = "none";
      makeMove(pp.from.r, pp.from.c, {...pp.move, promoteTo:t});
    });
    PROMO_CHOICES.appendChild(d);
  }
  PROMO_EL.style.display = "flex";
}

function reset() {
  aiThinking = false;
  state = initialState();
  refillShop();
  refillSpells();
  onTurnStart("w");
  render();
}

function enableAI() {
  if (state.gameStarted || state.gameOver) return;
  state.aiOpponent = true;
  state.aiColor = "b";   // human is White, AI plays Black
  state.gameStarted = true;
  render();
}


document.getElementById("resetBtn").addEventListener("click", reset);
document.getElementById("aiBtn").addEventListener("click", enableAI);
document.getElementById("flipBtn").addEventListener("click", () => {
  flipped = !flipped;
  render();
});
document.getElementById("cancelBtn").addEventListener("click", cancelPlacement);
  document.getElementById("skipBtn").addEventListener("click", () => {
    if (state.taxSkipPending || state.summonSkipPending) spellEndTurnSkip(false);
  });
  document.getElementById("skipSpellBtn").addEventListener("click", skipFollowUpSpell);

state = initialState();
refillShop();
refillSpells();
onTurnStart("w");
render();
</script>
</body>
</html>
